[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/daemon", "crates/journal", "crates/proto", "crates/ui"]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gethostname = "1"
gpui = "=0.2.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
imara-diff = "0.2"
notify = "8"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
