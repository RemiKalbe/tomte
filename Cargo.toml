[workspace]
resolver = "2"
members = ["crates/core", "crates/journal"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
imara-diff = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2"
tempfile = "3"
