[package]
name = "tomte-daemon"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "tomted"
path = "src/main.rs"

[lib]
name = "tomte_daemon"

[dependencies]
libc.workspace = true
tomte-core = { path = "../core" }
tomte-journal = { path = "../journal" }
tomte-proto = { path = "../proto" }
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
gethostname.workspace = true

[dev-dependencies]
tomte-core = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
