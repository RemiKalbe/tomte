[package]
name = "tomte-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[lib]
name = "tomte_app"
path = "src/lib.rs"

[[bin]]
name = "tomte"
path = "src/main.rs"

[dependencies]
tomte-core = { path = "../core" }
tomte-journal = { path = "../journal" }
tomte-proto = { path = "../proto" }
tomte-ui = { path = "../ui" }
gpui.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tomte-daemon = { path = "../daemon" }
tomte-core = { path = "../core", features = ["test-support"] }
tempfile.workspace = true
