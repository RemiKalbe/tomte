name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The e2e suites drive the real chezmoi binary.
      - name: Install chezmoi
        run: brew install chezmoi
      - name: fmt
        run: cargo fmt --all --check
      # Bin artifacts exist BEFORE tests run: the e2e suite spawns the real
      # target/debug/{tomte,tomted}, and building them from inside parallel
      # tests raced on cold runners.
      - name: build
        run: cargo build --workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
